name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS
            runner: macos-latest
            dist_command: npm run dist:mac -- --publish never
            artifact_name: yclaw-macos
          - name: Windows
            runner: windows-latest
            dist_command: npm run dist:win -- --publish never
            artifact_name: yclaw-windows
          - name: Linux
            runner: ubuntu-latest
            dist_command: npm run dist:linux -- --publish never
            artifact_name: yclaw-linux
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      npm_config_registry: https://registry.npmjs.org/
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci --no-audit --ignore-scripts

      - name: Verify build inputs
        run: npm run build

      - name: Package app
        run: ${{ matrix.platform.dist_command }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: release/**
          if-no-files-found: error

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org/

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes from changelog
        run: node .github/scripts/extract-release-notes.mjs "${GITHUB_REF_NAME}" release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: YClaw ${{ github.ref_name }}
          body_path: release-notes.md
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
