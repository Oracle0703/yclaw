appId: com.yclaw.desktop
productName: YClaw
copyright: Copyright © 2026

directories:
  output: release
  buildResources: resources

afterPack: scripts/after-pack-prune.cjs

compression: maximum

files:
  - from: .
    filter:
      - package.json
      - dist/main/**/*
      - dist/renderer/entries/workbench/**/*
      - dist/renderer/entries/browser/**/*
      - dist/renderer/plugin-host/**/*
      - dist/renderer/assets/**/*
      - node_modules/**/*
      - resources/**/*
      - '!node_modules/**/*.d.ts'
      - '!node_modules/**/*.d.cts'
      - '!node_modules/**/*.d.mts'
      - '!node_modules/**/src/**/*.ts'
      - '!node_modules/**/src/**/*.tsx'
      - '!node_modules/**/src/**/*.cts'
      - '!node_modules/**/src/**/*.mts'
      - '!node_modules/**/tests{,/**/*}'
      - '!node_modules/**/__tests__{,/**/*}'
      - '!node_modules/**/docs{,/**/*}'
      - '!node_modules/**/examples{,/**/*}'
      - '!dist/features{,/**/*}'
      - '!resources/feature-packs{,/**/*}'
      - '!docs{,/**/*}'
      - '!tests{,/**/*}'
      - '!src{,/**/*}'
      - '!plugins/_template{,/**/*}'
      - '!**/*.map'

asar: true
asarUnpack:
  - node_modules/better-sqlite3/build/Release/*.node

electronLanguages:
  - zh-CN
  - en-US

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

win:
  target:
    - target: nsis-web
      arch:
        - x64

nsisWeb:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage

publish:
  provider: github
