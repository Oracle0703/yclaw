appId: com.yclaw.desktop
productName: YClaw
copyright: Copyright © 2026

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - package.json
  - node_modules/**/*
  - resources/**/*

asar: true

mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip

win:
  target:
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  target:
    - AppImage

publish:
  provider: github
